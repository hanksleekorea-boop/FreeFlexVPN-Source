<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FreeFlexVPN 공동개발</title>
  <style>
    :root{color-scheme:light dark;font:16px/1.55 system-ui,sans-serif}body{max-width:760px;margin:auto;padding:24px}main{display:grid;gap:18px}.card{border:1px solid #8886;border-radius:16px;padding:20px}label,input,button{display:block;width:100%;box-sizing:border-box}input,button{font:inherit;padding:12px;margin-top:8px}button{cursor:pointer;font-weight:700}.muted{opacity:.75}.ok{color:#168344}.warn{color:#b85c00}code{overflow-wrap:anywhere}ol{padding-left:24px}@media(max-width:420px){body{padding:12px}.card{padding:16px}}
  </style>
</head>
<body>
<main>
  <header><h1>FreeFlexVPN 공동개발</h1><p>비밀번호는 이 서버에서만 확인하며 GitHub 인증 열쇠를 브라우저에 전달하지 않습니다.</p></header>
  <section class="card" id="login-card">
    <h2>1. 참여자 로그인</h2>
    <form id="login-form"><label for="password">공동개발 비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="14" required><button>안전하게 시작</button></form>
    <p id="message" role="status" aria-live="polite" class="muted">비밀번호 원문은 저장하지 않습니다.</p>
  </section>
  <section class="card" aria-labelledby="journey-title"><h2 id="journey-title">진행 단계</h2><ol><li>프로젝트 찾기</li><li>소유자 권한 확인</li><li>공동개발 방식 준비</li><li>안전장치 검사</li><li>참여자 시험</li><li>Drive 조건 확인</li><li>실제 개발 시험</li><li>사용법·복구 인계</li></ol></section>
  <section class="card" id="status-card" hidden><h2>현재 상태</h2><pre id="status"></pre><p class="warn">파일 편집·Git 중계·운영 배포는 서버 중계 연결과 종단간 검사가 끝난 뒤에만 열립니다.</p></section>
</main>
<script src="/collaboration-portal.js" defer></script>
</body>
</html>
