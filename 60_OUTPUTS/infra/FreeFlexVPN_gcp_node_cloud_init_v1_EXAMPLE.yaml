    {
      "path": "/opt/freeflexvpn/quota_agent.py",
      "owner": "root:root",
      "permissions": "0750",
      "content": "#!/usr/bin/env python3\n\"\"\"WireGuard 누적 카운터를 FreeFlexVPN 월 1GB·충전 잔액에 반영한다.\n\n대상 서버에서는 root 전용 systemd 서비스로 실행한다. 상태를 먼저 원자 저장한 뒤\nnftables 차단 세트를 한 트랜잭션으로 동기화한다. 손상된 상태 파일은 덮어쓰지 않는다.\n\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nimport base64\nimport binascii\nimport contextlib\nimport copy\nimport datetime as dt\nimport ipaddress\nimport json\nimport os\nimport pathlib\nimport re\nimport subprocess\nimport sys\nimport tempfile\nfrom typing import Any, Iterator\n\ntry:\n    import fcntl\nexcept ImportError:  # Windows 로컬 순수함수 테스트용; 대상 Ubuntu에는 반드시 존재한다.\n    fcntl = None\n\nPRODUCT_NAME = \"FreeFlexVPN\"\nSCHEMA_VERSION = 2\nGB = 1_000_000_000\nFREE_CAP_BYTES = GB\nMAX_ACTIVE_PEERS_PER_ACCOUNT = 2\nDEFAULT_STATE_PATH = pathlib.Path(\"/var/lib/freeflexvpn/quota/state.json\")\n\n\nclass QuotaStateError(RuntimeError):\n    \"\"\"상태를 안전하게 읽거나 기록할 수 없을 때 발생한다.\"\"\"\n\n\ndef month_key(now: dt.datetime | None = None) -> str:\n    value = now or dt.datetime.now(dt.timezone.utc)\n    if value.tzinfo is None:\n        value = value.replace(tzinfo=dt.timezone.utc)\n    value = value.astimezone(dt.timezone.utc)\n    return f\"{value.year:04d}-{value.month:02d}\"\n\n\ndef empty_state() -> dict[str, Any]:\n    return {\"schema_version\": SCHEMA_VERSION, \"product\": PRODUCT_NAME, \"peers\": {}, \"updated_at\": None}\n\n\ndef validate_allowed_ip(value: str) -> str:\n    values = [part.strip() for part in value.split(\",\") if part.strip()]\n    if len(values) != 1:\n        raise ValueError(\"피어 AllowedIPs는 IPv4 /32 한 개여야 합니다\")\n    network = ipaddress.ip_network(values[0], strict=True)\n    if network.version != 4 or network.prefixlen != 32:\n        raise ValueError(\"피어 AllowedIPs는 IPv4 /32 한 개여야 합니다\")\n    return str(network.network_address)\n\n\ndef validate_public_key(value: str) -> str:\n    try:\n        raw = base64.b64decode(value, validate=True)\n    except (binascii.Error, ValueError) as exc:\n        raise ValueError(\"WireGuard 공개키가 올바른 base64가 아닙니다\") from exc\n    if len(raw) != 32 or raw == bytes(32):\n        raise ValueError(\"WireGuard 공개키는 0이 아닌 32바이트여야 합니다\")\n    return value\n\n\ndef validate_account_id(value: str) -> str:\n    \"\"\"가입 계층이 만든 비가역 64자리 소문자 hex 가명 ID만 받는다.\"\"\"\n    if not re.fullmatch(r\"[0-9a-f]{64}\", value or \"\"):\n        raise ValueError(\"계정 ID는 HMAC-SHA256 기반 64자리 소문자 hex 가명값이어야 합니다\")\n    return value\n\n\ndef parse_wg_dump(text: str) -> dict[str, dict[str, Any]]:\n    lines = [line for line in text.splitlines() if line.strip()]\n    if not lines:\n        return {}\n    peers: dict[str, dict[str, Any]] = {}\n    for line in lines[1:]:\n        fields = line.split(\"\\t\")\n        if len(fields) < 8:\n            raise ValueError(\"wg dump 피어 행의 필드가 부족합니다\")\n        public_key = fields[0].strip()\n        if not public_key or public_key == \"(none)\":\n            raise ValueError(\"wg dump 피어 공개키가 없습니다\")\n        allowed_ip = validate_allowed_ip(fields[3])\n        latest_handshake_epoch = int(fields[4])\n        rx_bytes, tx_bytes = int(fields[5]), int(fields[6])\n        if latest_handshake_epoch < 0:\n            raise ValueError(\"WireGuard 핸드셰이크 시각은 음수일 수 없습니다\")\n        if rx_bytes < 0 or tx_bytes < 0:\n            raise ValueError(\"WireGuard 전송량은 음수일 수 없습니다\")\n        peers[public_key] = {\n            \"allowed_ip\": allowed_ip,\n            \"rx_bytes\": rx_bytes,\n            \"tx_bytes\": tx_bytes,\n            \"total_bytes\": rx_bytes + tx_bytes,\n            \"latest_handshake_epoch\": latest_handshake_epoch,\n        }\n    return peers\n\n\ndef _validate_state(state: dict[str, Any]) -> None:\n    if state.get(\"schema_version\") != SCHEMA_VERSION or state.get(\"product\") != PRODUCT_NAME:\n        raise QuotaStateError(\"지원하지 않는 쿼터 상태 스키마입니다\")\n    if not isinstance(state.get(\"peers\"), dict):\n        raise QuotaStateError(\"피어 원장이 객체가 아닙니다\")\n    for key, peer in state[\"peers\"].items():\n        required = {\"account_id\", \"allowed_ip\", \"enrolled\", \"free_month\", \"free_used_bytes\", \"paid_bytes\", \"last_total_bytes\", \"blocked\"}\n        if not isinstance(key, str) or not required.issubset(peer):\n            raise QuotaStateError(\"피어 원장의 필수 필드가 없습니다\")\n        validate_public_key(key)\n        validate_allowed_ip(str(peer[\"allowed_ip\"]) + \"/32\")\n        if peer[\"enrolled\"]:\n            validate_account_id(str(peer[\"account_id\"]))\n        elif peer[\"account_id\"] is not None:\n            validate_account_id(str(peer[\"account_id\"]))\n        for field in (\"free_used_bytes\", \"paid_bytes\", \"last_total_bytes\"):\n            if int(peer[field]) < 0:\n                raise QuotaStateError(f\"{field}는 음수일 수 없습니다\")\n\n\ndef load_state(path: pathlib.Path) -> dict[str, Any]:\n    if not path.exists():\n        return empty_state()\n    try:\n        state = json.loads(path.read_text(encoding=\"utf-8\"))\n        _validate_state(state)\n        return state\n    except (OSError, UnicodeError, json.JSONDecodeError, TypeError, ValueError, QuotaStateError) as exc:\n        raise QuotaStateError(\n            f\"쿼터 상태를 읽지 못했습니다. 원본을 보존하고 차단 상태를 변경하지 않습니다: {type(exc).__name__}\"\n        ) from exc\n\n\ndef write_state_atomic(path: pathlib.Path, state: dict[str, Any]) -> None:\n    path.parent.mkdir(parents=True, exist_ok=True)\n    candidate = copy.deepcopy(state)\n    candidate[\"updated_at\"] = dt.datetime.now(dt.timezone.utc).isoformat()\n    fd, tmp_name = tempfile.mkstemp(prefix=\".state.\", suffix=\".json\", dir=path.parent)\n    tmp = pathlib.Path(tmp_name)\n    try:\n        with os.fdopen(fd, \"w\", encoding=\"utf-8\", newline=\"\\n\") as handle:\n            json.dump(candidate, handle, ensure_ascii=False, indent=2, sort_keys=True)\n            handle.write(\"\\n\")\n            handle.flush()\n            os.fsync(handle.fileno())\n        os.chmod(tmp, 0o600)\n        os.replace(tmp, path)\n        if os.name != \"nt\":\n            dir_fd = os.open(path.parent, os.O_RDONLY)\n            try:\n                os.fsync(dir_fd)\n            finally:\n                os.close(dir_fd)\n        state.clear()\n        state.update(candidate)\n    except OSError as exc:\n        with contextlib.suppress(OSError):\n            tmp.unlink()\n        raise QuotaStateError(\n            f\"쿼터 상태 저장에 실패했습니다. 방화벽은 변경하지 않습니다: {type(exc).__name__}\"\n        ) from exc\n\n\n@contextlib.contextmanager\ndef state_lock(path: pathlib.Path) -> Iterator[None]:\n    path.parent.mkdir(parents=True, exist_ok=True)\n    lock_path = path.parent / \".lock\"\n    with lock_path.open(\"a+b\") as handle:\n        if fcntl is not None:\n            fcntl.flock(handle.fileno(), fcntl.LOCK_EX)\n        yield\n\n\ndef reset_month(peer: dict[str, Any], now: dt.datetime | None = None) -> None:\n    current = month_key(now)\n    if peer[\"free_month\"] != current:\n        peer[\"free_month\"] = current\n        peer[\"free_used_bytes\"] = 0\n\n\ndef available_bytes(peer: dict[str, Any], now: dt.datetime | None = None) -> int:\n    reset_month(peer, now)\n    free_remaining = max(0, FREE_CAP_BYTES - int(peer[\"free_used_bytes\"]))\n    return free_remaining + int(peer[\"paid_bytes\"])\n\n\ndef charge_counter(peer: dict[str, Any], current_total: int, now: dt.datetime | None = None) -> dict[str, int | bool]:\n    if current_total < 0:\n        raise ValueError(\"누적 전송량은 음수일 수 없습니다\")\n    reset_month(peer, now)\n    previous = int(peer[\"last_total_bytes\"])\n    delta = current_total - previous if current_total >= previous else current_total\n    available = available_bytes(peer, now)\n    charged = min(delta, available)\n    free_remaining = max(0, FREE_CAP_BYTES - int(peer[\"free_used_bytes\"]))\n    from_free = min(charged, free_remaining)\n    from_paid = charged - from_free\n    peer[\"free_used_bytes\"] = int(peer[\"free_used_bytes\"]) + from_free\n    peer[\"paid_bytes\"] = int(peer[\"paid_bytes\"]) - from_paid\n    peer[\"last_total_bytes\"] = current_total\n    peer[\"blocked\"] = delta > charged or available_bytes(peer, now) == 0\n    peer[\"block_reason\"] = \"quota_exhausted\" if peer[\"blocked\"] else \"\"\n    return {\"delta_bytes\": delta, \"charged_bytes\": charged, \"blocked\": bool(peer[\"blocked\"])}\n\n\ndef new_peer(\n    allowed_ip: str,\n    *,\n    enrolled: bool,\n    account_id: str | None = None,\n    baseline: int = 0,\n    now: dt.datetime | None = None,\n) -> dict[str, Any]:\n    if enrolled:\n        validate_account_id(str(account_id or \"\"))\n    elif account_id is not None:\n        validate_account_id(account_id)\n    return {\n        \"account_id\": account_id,\n        \"allowed_ip\": validate_allowed_ip(allowed_ip + \"/32\"),\n        \"enrolled\": enrolled,\n        \"free_month\": month_key(now),\n        \"free_used_bytes\": 0,\n        \"paid_bytes\": 0,\n        \"last_total_bytes\": baseline,\n        \"blocked\": not enrolled,\n        \"block_reason\": \"enrollment_required\" if not enrolled else \"\",\n    }\n\n\ndef poll_state(state: dict[str, Any], observed: dict[str, dict[str, Any]], now: dt.datetime | None = None) -> dict[str, Any]:\n    result = {\"unknown_peers\": 0, \"charged_bytes\": 0, \"blocked_peers\": 0}\n    for public_key, sample in observed.items():\n        peer = state[\"peers\"].get(public_key)\n        if peer is None:\n            peer = new_peer(sample[\"allowed_ip\"], enrolled=False, baseline=sample[\"total_bytes\"], now=now)\n            state[\"peers\"][public_key] = peer\n            result[\"unknown_peers\"] += 1\n        elif peer[\"allowed_ip\"] != sample[\"allowed_ip\"]:\n            peer[\"blocked\"] = True\n            peer[\"block_reason\"] = \"allowed_ip_changed\"\n        elif peer[\"enrolled\"]:\n            charged = charge_counter(peer, sample[\"total_bytes\"], now)\n            result[\"charged_bytes\"] += int(charged[\"charged_bytes\"])\n        if peer[\"blocked\"]:\n            result[\"blocked_peers\"] += 1\n    return result\n\n\ndef nft_batch(state: dict[str, Any]) -> str:\n    blocked = sorted({str(peer[\"allowed_ip\"]) for peer in state[\"peers\"].values() if peer[\"blocked\"]})\n    lines = [\"flush set inet freeflex_filter quota_blocked_v4\"]\n    if blocked:\n        lines.append(\"add element inet freeflex_filter quota_blocked_v4 { \" + \", \".join(blocked) + \" }\")\n    return \"\\n\".join(lines) + \"\\n\"\n\n\ndef sync_firewall(state: dict[str, Any]) -> None:\n    proc = subprocess.run([\"nft\", \"-f\", \"-\"], input=nft_batch(state), text=True, capture_output=True)\n    if proc.returncode != 0:\n        raise RuntimeError(f\"nftables 쿼터 차단 동기화 실패: {proc.stderr.strip()}\")\n\n\ndef read_wg() -> dict[str, dict[str, Any]]:\n    proc = subprocess.run([\"wg\", \"show\", \"wg0\", \"dump\"], text=True, capture_output=True)\n    if proc.returncode != 0:\n        raise RuntimeError(f\"WireGuard 카운터 읽기 실패: {proc.stderr.strip()}\")\n    return parse_wg_dump(proc.stdout)\n\n\ndef enroll(\n    state: dict[str, Any],\n    account_id: str,\n    public_key: str,\n    allowed_ip: str,\n    observed: dict[str, dict[str, Any]],\n    now: dt.datetime | None = None,\n) -> None:\n    account_id = validate_account_id(account_id)\n    validate_public_key(public_key)\n    ip = validate_allowed_ip(allowed_ip)\n    baseline = int(observed.get(public_key, {}).get(\"total_bytes\", 0))\n    existing = state[\"peers\"].get(public_key)\n    if existing and existing.get(\"enrolled\") and existing.get(\"account_id\") != account_id:\n        raise ValueError(\"이미 다른 가명 계정에 등록된 피어 공개키입니다\")\n    for key, peer in state[\"peers\"].items():\n        if key != public_key and peer.get(\"enrolled\") and peer.get(\"allowed_ip\") == ip:\n            raise ValueError(\"이미 다른 활성 피어가 사용 중인 Allowed IP입니다\")\n    active_for_account = sum(\n        1 for key, peer in state[\"peers\"].items()\n        if key != public_key and peer.get(\"enrolled\") and peer.get(\"account_id\") == account_id\n    )\n    if active_for_account >= MAX_ACTIVE_PEERS_PER_ACCOUNT:\n        raise ValueError(\"계정당 활성 기기 2대 제한을 초과했습니다\")\n    paid = int(existing.get(\"paid_bytes\", 0)) if existing else 0\n    state[\"peers\"][public_key] = new_peer(\n        ip, enrolled=True, account_id=account_id, baseline=baseline, now=now\n    )\n    state[\"peers\"][public_key][\"paid_bytes\"] = paid\n\n\ndef topup(state: dict[str, Any], public_key: str, amount_bytes: int, now: dt.datetime | None = None) -> None:\n    if amount_bytes <= 0:\n        raise ValueError(\"충전 바이트는 0보다 커야 합니다\")\n    peer = state[\"peers\"].get(public_key)\n    if not peer or not peer[\"enrolled\"]:\n        raise ValueError(\"등록된 피어가 아닙니다\")\n    peer[\"paid_bytes\"] = int(peer[\"paid_bytes\"]) + amount_bytes\n    if available_bytes(peer, now) > 0:\n        peer[\"blocked\"] = False\n        peer[\"block_reason\"] = \"\"\n\n\ndef revoke(state: dict[str, Any], public_key: str) -> None:\n    validate_public_key(public_key)\n    peer = state[\"peers\"].get(public_key)\n    if not peer:\n        raise ValueError(\"등록된 피어가 아닙니다\")\n    peer[\"enrolled\"] = False\n    peer[\"blocked\"] = True\n    peer[\"block_reason\"] = \"revoked\"\n\n\ndef sync_wireguard(state: dict[str, Any], observed: dict[str, dict[str, Any]] | None = None) -> dict[str, int]:\n    current = observed if observed is not None else read_wg()\n    desired = {\n        key: peer for key, peer in state[\"peers\"].items()\n        if peer[\"enrolled\"] and peer.get(\"block_reason\") != \"revoked\"\n    }\n    removed = 0\n    ensured = 0\n    for public_key in sorted(set(current) - set(desired)):\n        proc = subprocess.run(\n            [\"wg\", \"set\", \"wg0\", \"peer\", public_key, \"remove\"],\n            text=True, capture_output=True,\n        )\n        if proc.returncode != 0:\n            raise RuntimeError(f\"미등록·폐기 피어 제거 실패: {proc.stderr.strip()}\")\n        removed += 1\n    for public_key, peer in sorted(desired.items()):\n        allowed = str(peer[\"allowed_ip\"]) + \"/32\"\n        proc = subprocess.run(\n            [\"wg\", \"set\", \"wg0\", \"peer\", public_key, \"allowed-ips\", allowed],\n            text=True, capture_output=True,\n        )\n        if proc.returncode != 0:\n            raise RuntimeError(f\"등록 피어 적용 실패: {proc.stderr.strip()}\")\n        ensured += 1\n    return {\"removed_peers\": removed, \"ensured_peers\": ensured}\n\n\ndef main(argv: list[str] | None = None) -> int:\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument(\"--state\", type=pathlib.Path, default=DEFAULT_STATE_PATH)\n    sub = parser.add_subparsers(dest=\"command\", required=True)\n    sub.add_parser(\"poll\")\n    enroll_p = sub.add_parser(\"enroll\")\n    enroll_p.add_argument(\"--account-id\", required=True, help=\"가입 계층이 만든 64자리 HMAC 가명 ID\")\n    enroll_p.add_argument(\"--peer-key\", required=True)\n    enroll_p.add_argument(\"--allowed-ip\", required=True, help=\"예: 10.66.0.2/32\")\n    topup_p = sub.add_parser(\"topup\")\n    topup_p.add_argument(\"--peer-key\", required=True)\n    topup_p.add_argument(\"--bytes\", type=int, required=True)\n    revoke_p = sub.add_parser(\"revoke\")\n    revoke_p.add_argument(\"--peer-key\", required=True)\n    sub.add_parser(\"status\")\n    args = parser.parse_args(argv)\n\n    try:\n        with state_lock(args.state):\n            state = load_state(args.state)\n            if args.command == \"status\":\n                print(json.dumps(state, ensure_ascii=False, indent=2, sort_keys=True))\n                return 0\n            result: dict[str, Any] = {\"command\": args.command}\n            if args.command == \"poll\":\n                before_sync = read_wg()\n                sync_result = sync_wireguard(state, before_sync)\n                observed = read_wg()\n                result.update(poll_state(state, observed))\n                result.update(sync_result)\n                result[\"unknown_peers\"] += sync_result[\"removed_peers\"]\n            elif args.command == \"enroll\":\n                observed = read_wg()\n                enroll(state, args.account_id, args.peer_key, args.allowed_ip, observed)\n            elif args.command == \"topup\":\n                topup(state, args.peer_key, args.bytes)\n            elif args.command == \"revoke\":\n                revoke(state, args.peer_key)\n            write_state_atomic(args.state, state)\n            if args.command == \"revoke\":\n                errors = []\n                try:\n                    sync_firewall(state)\n                except RuntimeError as exc:\n                    errors.append(str(exc))\n                try:\n                    result.update(sync_wireguard(state))\n                except RuntimeError as exc:\n                    errors.append(str(exc))\n                if errors:\n                    raise RuntimeError(\"; \".join(errors))\n            else:\n                sync_firewall(state)\n                if args.command in {\"enroll\", \"topup\"}:\n                    result.update(sync_wireguard(state))\n            print(json.dumps(result, ensure_ascii=False, sort_keys=True))\n            return 3 if result.get(\"unknown_peers\") else 0\n    except (QuotaStateError, RuntimeError, ValueError, OSError) as exc:\n        print(f\"FATAL: {exc}\", file=sys.stderr)\n        return 2\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n"
    },
    {
      "path": "/opt/freeflexvpn/exit_admin.py",
      "owner": "root:root",
      "permissions": "0750",
      "content": "#!/usr/bin/env python3\n\"\"\"SSH를 통해 호출되는 FreeFlexVPN exit-node 피어 관리 CLI.\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nimport copy\nimport hashlib\nimport json\nimport os\nimport pathlib\nimport re\nimport tempfile\nfrom datetime import datetime, timezone\nfrom typing import Any\n\ntry:\n    from . import quota_agent as qa\nexcept ImportError:  # 대상 서버의 /opt/freeflexvpn 직접 실행 경로\n    import quota_agent as qa  # type: ignore\n\n\nSCHEMA_VERSION = 1\nPRODUCT_NAME = \"FreeFlexVPN\"\nDEFAULT_STATE_PATH = pathlib.Path(\"/var/lib/freeflexvpn/admin/state.json\")\nDEFAULT_QUOTA_PATH = pathlib.Path(\"/var/lib/freeflexvpn/quota/state.json\")\nDEFAULT_HEALTH_PATH = pathlib.Path(\"/var/lib/freeflexvpn/health/latest.json\")\nDEFAULT_SERVER_PUBLIC_KEY_PATH = pathlib.Path(\"/etc/wireguard/wg0.pub\")\nDEFAULT_BOOT_ID_PATH = pathlib.Path(\"/proc/sys/kernel/random/boot_id\")\n_DEVICE_ID = re.compile(r\"^[a-f0-9]{32}$\")\n_NODE_ID = re.compile(r\"^[a-z0-9](?:[a-z0-9-]{0,30}[a-z0-9])?$\")\n\n\ndef empty_state(node_id: str) -> dict[str, Any]:\n    return {\n        \"schema_version\": SCHEMA_VERSION,\n        \"product\": PRODUCT_NAME,\n        \"node_id\": node_id,\n        \"peers\": {},\n        \"updated_at\": None,\n    }\n\n\ndef _validate_state(state: dict[str, Any], node_id: str) -> None:\n    if (\n        state.get(\"schema_version\") != SCHEMA_VERSION\n        or state.get(\"product\") != PRODUCT_NAME\n        or state.get(\"node_id\") != node_id\n        or not isinstance(state.get(\"peers\"), dict)\n    ):\n        raise qa.QuotaStateError(\"지원하지 않는 exit admin 상태입니다\")\n    for device_id, peer in state[\"peers\"].items():\n        if not _DEVICE_ID.fullmatch(str(device_id)):\n            raise qa.QuotaStateError(\"장치 ID가 올바르지 않습니다\")\n        if not {\"account_id\", \"public_key\", \"allowed_ip\", \"status\"}.issubset(peer):\n            raise qa.QuotaStateError(\"exit admin 피어 필드가 부족합니다\")\n        qa.validate_account_id(str(peer[\"account_id\"]))\n        qa.validate_public_key(str(peer[\"public_key\"]))\n        qa.validate_allowed_ip(str(peer[\"allowed_ip\"]) + \"/32\")\n        if peer[\"status\"] not in (\"provisioning\", \"active\", \"revoking\", \"revoked\"):\n            raise qa.QuotaStateError(\"exit admin 피어 상태가 올바르지 않습니다\")\n\n\ndef load_state(path: pathlib.Path, node_id: str) -> dict[str, Any]:\n    if not path.exists():\n        return empty_state(node_id)\n    try:\n        state = json.loads(path.read_text(encoding=\"utf-8\"))\n        _validate_state(state, node_id)\n        return state\n    except (OSError, UnicodeError, json.JSONDecodeError, TypeError, ValueError, qa.QuotaStateError) as exc:\n        raise qa.QuotaStateError(\n            f\"exit admin 상태를 읽지 못했습니다. 원본을 덮어쓰지 않습니다: {type(exc).__name__}\"\n        ) from exc\n\n\ndef write_state_atomic(path: pathlib.Path, state: dict[str, Any]) -> None:\n    path.parent.mkdir(parents=True, exist_ok=True)\n    candidate = copy.deepcopy(state)\n    candidate[\"updated_at\"] = datetime.now(timezone.utc).isoformat()\n    descriptor, name = tempfile.mkstemp(prefix=\".admin.\", suffix=\".json\", dir=path.parent)\n    temp = pathlib.Path(name)\n    try:\n        with os.fdopen(descriptor, \"w\", encoding=\"utf-8\", newline=\"\\n\") as handle:\n            json.dump(candidate, handle, ensure_ascii=False, indent=2, sort_keys=True)\n            handle.write(\"\\n\")\n            handle.flush()\n            os.fsync(handle.fileno())\n        os.chmod(temp, 0o600)\n        os.replace(temp, path)\n        state.clear()\n        state.update(candidate)\n    except OSError as exc:\n        try:\n            temp.unlink(missing_ok=True)\n        except OSError:\n            pass\n        raise qa.QuotaStateError(\n            f\"exit admin 상태 저장에 실패해 런타임 변경을 확정하지 않습니다: {type(exc).__name__}\"\n        ) from exc\n\n\ndef _next_address(state: dict[str, Any]) -> str:\n    used = {str(peer[\"allowed_ip\"]) for peer in state[\"peers\"].values()}\n    # 폐기된 주소도 A0에서는 재사용하지 않아 오래된 QR과 새 피어의 충돌을 막는다.\n    for host in qa.ipaddress.ip_network(\"10.66.0.0/24\").hosts():\n        if str(host) == \"10.66.0.1\":\n            continue\n        if str(host) not in used:\n            return str(host)\n    raise RuntimeError(\"exit 노드의 A0 피어 주소가 모두 사용됐습니다\")\n\n\ndef _verify_runtime(public_key: str, allowed_ip: str, observed: dict[str, dict[str, Any]]) -> bool:\n    peer = observed.get(public_key)\n    return bool(peer and peer.get(\"allowed_ip\") == allowed_ip)\n\n\nclass ExitAdmin:\n    def __init__(\n        self,\n        *,\n        node_id: str,\n        state_path: pathlib.Path = DEFAULT_STATE_PATH,\n        quota_path: pathlib.Path = DEFAULT_QUOTA_PATH,\n        health_path: pathlib.Path = DEFAULT_HEALTH_PATH,\n        server_public_key_path: pathlib.Path = DEFAULT_SERVER_PUBLIC_KEY_PATH,\n        boot_id_path: pathlib.Path = DEFAULT_BOOT_ID_PATH,\n    ):\n        if not _NODE_ID.fullmatch(node_id):\n            raise ValueError(\"node_id 형식이 올바르지 않습니다\")\n        self.node_id = node_id\n        self.state_path = pathlib.Path(state_path)\n        self.quota_path = pathlib.Path(quota_path)\n        self.health_path = pathlib.Path(health_path)\n        self.server_public_key_path = pathlib.Path(server_public_key_path)\n        self.boot_id_path = pathlib.Path(boot_id_path)\n\n    def provision(self, account_id: str, device_id: str, public_key: str) -> dict[str, Any]:\n        qa.validate_account_id(account_id)\n        qa.validate_public_key(public_key)\n        if not _DEVICE_ID.fullmatch(device_id):\n            raise ValueError(\"device_id는 32자리 소문자 hex여야 합니다\")\n        with qa.state_lock(self.quota_path):\n            state = load_state(self.state_path, self.node_id)\n            existing = state[\"peers\"].get(device_id)\n            if existing:\n                if existing[\"account_id\"] != account_id or existing[\"public_key\"] != public_key:\n                    raise ValueError(\"같은 device_id에 다른 계정 또는 공개키를 사용할 수 없습니다\")\n                allowed_ip = str(existing[\"allowed_ip\"])\n                duplicate = existing[\"status\"] == \"active\"\n            else:\n                active_count = sum(\n                    1 for peer in state[\"peers\"].values()\n                    if peer[\"account_id\"] == account_id and peer[\"status\"] in (\"provisioning\", \"active\")\n                )\n                if active_count >= qa.MAX_ACTIVE_PEERS_PER_ACCOUNT:\n                    raise ValueError(\"계정당 활성 기기 2대 제한을 초과했습니다\")\n                if any(peer[\"public_key\"] == public_key for peer in state[\"peers\"].values()):\n                    raise ValueError(\"이미 등록 또는 폐기된 WireGuard 공개키입니다\")\n                allowed_ip = _next_address(state)\n                state[\"peers\"][device_id] = {\n                    \"account_id\": account_id,\n                    \"public_key\": public_key,\n                    \"allowed_ip\": allowed_ip,\n                    \"status\": \"provisioning\",\n                    \"created_at\": datetime.now(timezone.utc).isoformat(),\n                    \"revoked_at\": None,\n                }\n                duplicate = False\n                write_state_atomic(self.state_path, state)\n\n            quota = qa.load_state(self.quota_path)\n            before = qa.read_wg()\n            qa.enroll(quota, account_id, public_key, allowed_ip, before)\n            qa.write_state_atomic(self.quota_path, quota)\n            qa.sync_firewall(quota)\n            qa.sync_wireguard(quota, before)\n            confirmed = _verify_runtime(public_key, allowed_ip, qa.read_wg())\n            if not confirmed:\n                raise RuntimeError(\"WireGuard 피어 readback이 등록 결과와 일치하지 않습니다\")\n            state = load_state(self.state_path, self.node_id)\n            state[\"peers\"][device_id][\"status\"] = \"active\"\n            write_state_atomic(self.state_path, state)\n            return {\n                \"applied\": True,\n                \"duplicate\": duplicate,\n                \"node_id\": self.node_id,\n                \"device_id\": device_id,\n                \"assigned_address\": allowed_ip + \"/32\",\n                \"runtime_confirmed\": True,\n            }\n\n    def revoke(self, device_id: str) -> dict[str, Any]:\n        if not _DEVICE_ID.fullmatch(device_id):\n            raise ValueError(\"device_id는 32자리 소문자 hex여야 합니다\")\n        with qa.state_lock(self.quota_path):\n            state = load_state(self.state_path, self.node_id)\n            peer = state[\"peers\"].get(device_id)\n            if peer is None:\n                raise ValueError(\"등록된 device_id가 아닙니다\")\n            duplicate = peer[\"status\"] == \"revoked\"\n            peer[\"status\"] = \"revoking\"\n            write_state_atomic(self.state_path, state)\n            quota = qa.load_state(self.quota_path)\n            qa.revoke(quota, str(peer[\"public_key\"]))\n            qa.write_state_atomic(self.quota_path, quota)\n            qa.sync_firewall(quota)\n            qa.sync_wireguard(quota, qa.read_wg())\n            confirmed = str(peer[\"public_key\"]) not in qa.read_wg()\n            if not confirmed:\n                raise RuntimeError(\"WireGuard 피어가 readback에서 여전히 발견됩니다\")\n            state = load_state(self.state_path, self.node_id)\n            state[\"peers\"][device_id][\"status\"] = \"revoked\"\n            state[\"peers\"][device_id][\"revoked_at\"] = datetime.now(timezone.utc).isoformat()\n            write_state_atomic(self.state_path, state)\n            return {\n                \"applied\": True,\n                \"duplicate\": duplicate,\n                \"node_id\": self.node_id,\n                \"device_id\": device_id,\n                \"runtime_confirmed\": True,\n            }\n\n    def counters(self) -> dict[str, Any]:\n        state = load_state(self.state_path, self.node_id)\n        observed = qa.read_wg()\n        boot_id = self.boot_id_path.read_text(encoding=\"ascii\").strip()\n        epoch = int(hashlib.sha256(boot_id.encode(\"ascii\")).hexdigest()[:15], 16)\n        samples = []\n        for device_id, peer in state[\"peers\"].items():\n            if peer[\"status\"] != \"active\":\n                continue\n            sample = observed.get(str(peer[\"public_key\"]))\n            if sample is None:\n                continue\n            handshake_epoch = int(sample.get(\"latest_handshake_epoch\", 0))\n            handshake_at = (\n                datetime.fromtimestamp(handshake_epoch, tz=timezone.utc).isoformat()\n                if handshake_epoch > 0 else None\n            )\n            samples.append(\n                {\n                    \"device_id\": device_id,\n                    \"epoch\": epoch,\n                    \"rx_bytes\": int(sample[\"rx_bytes\"]),\n                    \"tx_bytes\": int(sample[\"tx_bytes\"]),\n                    \"handshake_at\": handshake_at,\n                }\n            )\n        return {\n            \"node_id\": self.node_id,\n            \"observed_at\": datetime.now(timezone.utc).isoformat(),\n            \"samples\": samples,\n        }\n\n    def health(self) -> dict[str, Any]:\n        try:\n            health = json.loads(self.health_path.read_text(encoding=\"utf-8\"))\n            public_key = self.server_public_key_path.read_text(encoding=\"ascii\").strip()\n            qa.validate_public_key(public_key)\n        except (OSError, UnicodeError, json.JSONDecodeError, ValueError) as exc:\n            raise RuntimeError(f\"health readback을 확인할 수 없습니다: {type(exc).__name__}\") from exc\n        if health.get(\"status\") not in (\"ok\", \"degraded\") or not health.get(\"checked_at\"):\n            raise RuntimeError(\"health readback 형식이 올바르지 않습니다\")\n        return {\n            \"node_id\": self.node_id,\n            \"health\": \"healthy\" if health[\"status\"] == \"ok\" else \"unavailable\",\n            \"measured_at\": str(health[\"checked_at\"]),\n            \"failures\": str(health.get(\"failures\", \"\")),\n            \"server_public_key\": public_key,\n        }\n\n\ndef main(argv: list[str] | None = None) -> int:\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument(\"--node-id\", required=True)\n    parser.add_argument(\"--state\", type=pathlib.Path, default=DEFAULT_STATE_PATH)\n    parser.add_argument(\"--quota-state\", type=pathlib.Path, default=DEFAULT_QUOTA_PATH)\n    sub = parser.add_subparsers(dest=\"command\", required=True)\n    provision = sub.add_parser(\"provision\")\n    provision.add_argument(\"--account-id\", required=True)\n    provision.add_argument(\"--device-id\", required=True)\n    provision.add_argument(\"--peer-key\", required=True)\n    revoke = sub.add_parser(\"revoke\")\n    revoke.add_argument(\"--device-id\", required=True)\n    sub.add_parser(\"counters\")\n    sub.add_parser(\"health\")\n    args = parser.parse_args(argv)\n    admin = ExitAdmin(node_id=args.node_id, state_path=args.state, quota_path=args.quota_state)\n    try:\n        if args.command == \"provision\":\n            result = admin.provision(args.account_id, args.device_id, args.peer_key)\n        elif args.command == \"revoke\":\n            result = admin.revoke(args.device_id)\n        elif args.command == \"counters\":\n            result = admin.counters()\n        else:\n            result = admin.health()\n        print(json.dumps(result, ensure_ascii=False, sort_keys=True))\n        return 0\n    except (qa.QuotaStateError, RuntimeError, ValueError, OSError) as exc:\n        print(json.dumps({\"error\": type(exc).__name__, \"message\": str(exc)}, ensure_ascii=False), file=qa.sys.stderr)\n        return 2\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n"
    },
    {
      "path": "/usr/local/sbin/freeflexvpn-bootstrap",
      "owner": "root:root",
      "permissions": "0750",
      "content": "#!/usr/bin/env bash\nset -Eeuo pipefail\nexport PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\n\nif systemctl is-active --quiet ufw; then\n  echo 'FATAL: ufw가 활성 상태입니다. 콘솔에서 방화벽 소유권을 확인하십시오.' >&2\n  exit 20\nfi\n\ninstall -d -m 0700 /etc/wireguard\ninstall -d -m 0750 /etc/freeflexvpn /var/lib/freeflexvpn/health\ninstall -d -m 0700 /var/lib/freeflexvpn/admin\nif [[ ! -s /etc/wireguard/wg0.key ]]; then\n  umask 077\n  wg genkey > /etc/wireguard/wg0.key\nfi\nwg pubkey < /etc/wireguard/wg0.key > /etc/wireguard/wg0.pub\nchmod 0600 /etc/wireguard/wg0.key\nchmod 0644 /etc/wireguard/wg0.pub\n\nsshd -t\nnft -c -f /etc/nftables.conf\nsysctl --system\nsystemctl daemon-reload\nsystemctl enable --now nftables\nsystemctl enable --now fail2ban\nsystemctl enable --now wg-quick@wg0\nsystemctl enable --now freeflexvpn-health.timer\nsystemctl enable --now freeflexvpn-quota.timer\nsystemctl restart ssh\n/usr/local/sbin/freeflexvpn-health\ntouch /var/lib/freeflexvpn/bootstrap-complete\n"
    },
    {
      "path": "/usr/local/sbin/freeflexvpn-health",
      "owner": "root:root",
      "permissions": "0750",
      "content": "#!/usr/bin/env bash\nset -u\nexport PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\nfailures=''\n\nprobe() {\n  local label=\"$1\"; shift\n  if ! \"$@\" >/dev/null 2>&1; then failures=\"${failures}${label},\"; fi\n}\n\nprobe ip_forward test \"$(sysctl -n net.ipv4.ip_forward 2>/dev/null)\" = 1\nprobe nftables systemctl is-active --quiet nftables\nprobe fail2ban systemctl is-active --quiet fail2ban\nprobe wireguard systemctl is-active --quiet wg-quick@wg0\nprobe wg_interface wg show wg0\nprobe key_mode test \"$(stat -c '%a' /etc/wireguard/wg0.key 2>/dev/null)\" = 600\nprobe quota_timer systemctl is-active --quiet freeflexvpn-quota.timer\n\nstatus=ok\nexit_code=0\nif [[ -n \"$failures\" ]]; then status=degraded; exit_code=1; fi\nchecked_at=\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"\ninstall -d -m 0750 /var/lib/freeflexvpn/health\ntmp=\"$(mktemp /var/lib/freeflexvpn/health/.latest.XXXXXX)\" || exit 2\nprintf '{\"status\":\"%s\",\"checked_at\":\"%s\",\"failures\":\"%s\"}\n'   \"$status\" \"$checked_at\" \"${failures%,}\" > \"$tmp\"\nchmod 0640 \"$tmp\"\nmv -f \"$tmp\" /var/lib/freeflexvpn/health/latest.json\n\nif [[ $exit_code -ne 0 ]]; then\n  logger -t freeflexvpn-health \"degraded: ${failures%,}\"\nfi\nexit \"$exit_code\"\n"
    },
    {
